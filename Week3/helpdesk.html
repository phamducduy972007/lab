<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Lab3">
    <meta name="keywords" content="Week3">
    <meta name="author" content="duy">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    <img src="logo.png" alt="Swinburne logo">
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form method="post">

        <fieldset>
            <legend>Student details</legend>

            <p>
                <label for="studentID">Student ID</label>
                <input type="text" id="studentID" name="studentID" 
                                    pattern="\d{7,10}"
                                    required = "required">
            </p>

            <p>
                <label for="givenName">Given Name</label>
                <input type="text" id="givenName" name="givenName" maxlength="15"  
                                    pattern="[A-Za-z\s]{1,15}"
                                    required="required">

                <label for="familyName">Family Name</label>
                <input type="text" id="familyName" name="familyName" maxlength="15"  
                                    pattern="[A-Za-z\s]{1,15}"
                                    required="required">
            </p>
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>

            <p>
                <input type="radio" id="cos10011" name="unit" value="COS10011" 
                                    required="required">
                <label for="cos10011">COS10011</label>

                <input type="radio" id="cos60004" name="unit" value="COS60004">
                <label for="cos60004">COS60004</label>

                <input type="radio" id="cos60007" name="unit" value="COS60007">
                <label for="cos60007">COS60007</label>
            </p>

            <p>
                <label for="tutor">Your Tutor</label>
                <select id="tutor" name="tutor" 
                        required=""required>
                    <option value="">Please Select</option>
                    <option value="tutor1">Alex</option>
                    <option value="tutor2">John</option>
                    <option value="tutor3">Sarah</option>
                </select>
            </p>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <p>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="issue" value="HTML" checked>

                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="issue" value="CSS">

                <label for="javascript">JavaScript</label>
                <input type="checkbox" id="javascript" name="issue" value="JavaScript">
  
                <label for="php">PHP</label>
                <input type="checkbox" id="php" name="issue" value="PHP">

                <label for="mysql">MySQL</label>
                <input type="checkbox" id="mysql" name="issue" value="MySQL">
            </p>

            <p>
                <label for="description">Description of Issue</label><br>
                <textarea id="description" name="description" rows="4" cols="40" placeholder="Write description of your problem here..."></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>
            <p>
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            </p>
            <p>
                <label for="time">Time</label>
                <input type="text" id="tim" name="Time" placeholder="00:00" pattern="\d{2}:\d{2}">
            </p>
        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset form">

    </form>
</body>
</html>
