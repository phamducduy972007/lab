<!DOCTYPE html>
<html>
    <meta charset="UTL-8">
    <meta name="desciption" content="helpdesk">
    <meta name="keywords" content="lab3">
    <meta name="author" content="ducduy">
    <title>CWA Help Desk Appointment</title>
</html>

<div>
    <img src="logo.png" alt="Swinburne logo">
    <h1>Cat Show Registration Page</h1>
    <form id="personal" method="post"></form>
        <p><label for="owner's name">Owner's Name</label>
        <input type="text" name="users_name" id="owner's name"/></p>

        <p><label for="email">Email</label>
        <input type="text" name="email_address" id="email"/></p>
</div>

<fieldset>
    <legend>Cat Information Details</legend>

    <p><label>Cat's Name
    <input type="text" name="cat_name"/></label></p>

    <p><label>Breed
        <select name="breed">
            <option value="british_shorthair">British Shorthair</option>
            <option value="burmese">Burmese</option>
            <option value="manx">Manx</option>
            <option value="ragdoll">Ragdoll</option>
            <option value="rusian_blue">Rusian Blue</option>
            <option value="siamese">Siamese</option>
            <option value="other">Other</option>
        </select>
    </label></p>
    
    <p><label>Day of Birth
    <input type="date" name="bday"/></label></p>
    
    <fieldset>
        <legend>Sex</legend>
        <p><label><input type="radio" name="sex" value="male"/>Male</label></p>
        
        <p><label><input type="radio" name="sex" value="female"/>Female</label></p>
    </fieldset>

    <fieldset>
        <legend>Competition Categories</legend>
        <p>Select which categories your would like your cat entered</p>
        
        <p><label>Best of Breed
        <input type="checkbox" name="categories" value="best_breed"/></label></p>
        
        <p><label>Cutest 
        <input type="checkbox" name="categories" value="cutest"/></label></p>

        <p><label>Ugliest 
        <input type="checkbox" name="categories" value="ugliest "/></label></p>

    </fieldset>

    <p><label>Comments
    <textarea name="comments" rows="4" cols="45"></textarea></label></p>
</fieldset>
